name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy -p diesel-sqlite-cipher --all-targets -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc -p diesel-sqlite-cipher --no-deps

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        codec: [none, sqlite3mc]
    env:
      DIESEL_SQLITE_CIPHER_TEST_CODEC: ${{ matrix.codec }}
      COVERAGE_FILE: target/coverage/${{ matrix.codec }}.lcov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build SQLite3 Multiple Ciphers
        if: matrix.codec != 'none'
        run: |
          manifest=$(cargo +stable metadata --format-version 1 | jq -r '.packages[] | select(.name == "sqlite3mc-src") | .manifest_path')
          source_dir=$(dirname "$manifest")
          codec_dir="$GITHUB_WORKSPACE/target/codec"
          mkdir -p "$codec_dir"
          cc -O2 -fPIC -shared -DSQLITE_THREADSAFE=1 -DSQLITE_TEMP_STORE=2 \
            -DSQLITE_ENABLE_COLUMN_METADATA \
            "$source_dir/sqlite3mc/sqlite3mc_amalgamation.c" \
            -o "$codec_dir/libsqlite3.so" -lm -ldl -pthread
          {
            echo "SQLITE3_LIB_DIR=$codec_dir"
            echo "LD_LIBRARY_PATH=$codec_dir"
            echo "SQLITE3_NO_PKG_CONFIG=1"
          } >> "$GITHUB_ENV"
      - name: Tests
        run: cargo +stable test --release -p diesel-sqlite-cipher
      - name: Install coverage toolchain
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Coverage
        run: |
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          cargo +nightly llvm-cov --release -p diesel-sqlite-cipher --all-targets --no-report
          cargo +nightly llvm-cov --release -p diesel-sqlite-cipher --doc --no-clean --lcov --output-path "$COVERAGE_FILE"
      - name: Upload coverage to Codecov
        if: >-
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_FILE }}
          flags: ${{ env.DIESEL_SQLITE_CIPHER_TEST_CODEC }}
          disable_search: true
          fail_ci_if_error: true

  sqlcipher:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      DIESEL_SQLITE_CIPHER_TEST_CODEC: sqlcipher
      COVERAGE_FILE: target/coverage/sqlcipher.lcov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Install test tools
        uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Build SQLCipher
        run: |
          manifest=$(cargo +stable metadata --format-version 1 | jq -r '.packages[] | select(.name == "sqlcipher-src") | .manifest_path')
          source_dir=$(dirname "$manifest")
          codec_dir="$GITHUB_WORKSPACE/target/codec"
          mkdir -p "$codec_dir"
          cc -O2 -fPIC -shared -DSQLITE_HAS_CODEC -DSQLITE_TEMP_STORE=2 \
            -DSQLITE_EXTRA_INIT=sqlcipher_extra_init \
            -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown \
            -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_THREADSAFE=1 \
            -DSQLITE_ENABLE_COLUMN_METADATA "$source_dir/sqlcipher/sqlcipher.c" \
            -o "$codec_dir/libsqlite3.so" -lcrypto -lm -ldl -pthread
          {
            echo "SQLITE3_LIB_DIR=$codec_dir"
            echo "LD_LIBRARY_PATH=$codec_dir"
            echo "SQLITE3_NO_PKG_CONFIG=1"
          } >> "$GITHUB_ENV"
      - name: Coverage
        run: |
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          cargo +nightly llvm-cov --release -p diesel-sqlite-cipher --all-targets --no-report
          cargo +nightly llvm-cov --release -p diesel-sqlite-cipher --doc --no-clean --lcov --output-path "$COVERAGE_FILE"
      - name: Upload coverage to Codecov
        if: >-
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_FILE }}
          flags: ${{ env.DIESEL_SQLITE_CIPHER_TEST_CODEC }}
          disable_search: true
          fail_ci_if_error: true

  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check minimum Rust version
        run: cargo +1.88.0 check -p diesel-sqlite-cipher --lib
